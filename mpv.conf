--no-osd-bar
#sub-codepage=utf8:cp1256
#sub-font=Yekan
volume-max=300
osd-font-size=20
screenshot-template="mpv-%F-%wH-%wM-%wS.%wT"
screenshot-jpeg-quality=100
#screenshot-png-compression=7
screenshot-directory="~/Pictures/"


profile=high-quality
vo=gpu-next
gpu-api=vulkan
# XWayland: real GNOME title bar, and no resize loop when dragging between the 100%/167% monitors
gpu-context=x11vk
# vulkan hwdec (picked by auto-safe) corrupts frames on NVIDIA
hwdec=nvdec
deband=yes
# smoother motion (optional):
#video-sync=display-resample
#interpolation=yes
#priority=high
sub-font="Arial"
# Optimized shaders for higher-end GPU: Mode A (HQ)
# glsl-shaders="~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Restore_CNN_VL.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_VL.glsl:~~/shaders/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"

# build a playlist from the file's folder so [ ] / ctrl+arrows browse it (replaces nextfile.lua)
autocreate-playlist=filter
directory-filter-types=video,audio,image
#loop-playlist=inf
osd-playing-msg='Now playing: ${filename}'
osd-playing-msg-duration=3000

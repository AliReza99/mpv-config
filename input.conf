MBTN_BACK seek -5 exact
MBTN_FORWARD seek 5 exact
s screenshot video
m ignore
A ignore
/ ignore
PGUP add volume 10
PGDWN add volume -10
UP add volume 10
DOWN add volume -10
Shift+RIGHT seek 5 exact
Shift+LEFT seek -5 exact
< multiply speed 1/1.1                 # decrease the playback speed
> multiply speed 1.1                   # increase the playback speed
ctrl++ add sub-scale +0.1             # increase the subtitle font size
ctrl+- add sub-scale -0.1     

ctrl+RIGHT playlist-next
ctrl+LEFT playlist-prev
] playlist-next
[ playlist-prev
WHEEL_UP      seek 10          # seek 10 seconds forward
WHEEL_DOWN    seek -10         # seek 10 seconds backward

CTRL+0 no-osd change-list glsl-shaders clr ""; no-osd set dscale hermite; no-osd set linear-downscaling yes; show-text "GLSL shaders cleared"

# Optimized shaders for higher-end GPU:
####################################
# for Linux:
CTRL+1 no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Restore_CNN_VL.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_VL.glsl:~~/shaders/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"; show-text "Anime4K: Mode A (HQ)"
